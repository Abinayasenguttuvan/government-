<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>404 - Page Not Found</title>

    <!-- Google Font -->

    <link rel="preconnect"
        href="https://fonts.googleapis.com">

    <link rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- CSS -->

    <link rel="stylesheet"
        href="css/404.css">

</head>

<body>

    <!--=========================================
                404 SECTION
    ==========================================-->

    <section class="gov404-page">

        <!-- Floating Shapes -->

        <span class="gov404-circle gov404-circle-one"></span>

        <span class="gov404-circle gov404-circle-two"></span>

        <span class="gov404-circle gov404-circle-three"></span>

        <span class="gov404-circle gov404-circle-four"></span>

        <div class="gov404-container">

            <!--==============================
                    Card
            ===============================-->

            <div class="gov404-card reveal-bottom">

                <!-- Top Badge -->

                <div class="gov404-badge">

                    <i class="fa-solid fa-triangle-exclamation"></i>

                    Error 404

                </div>

                <!-- Illustration -->

                <div class="gov404-illustration">

                    <div class="gov404-number">

                        <span>4</span>

                        <div class="gov404-face">

                            <div class="gov404-eye gov404-eye-left"></div>

                            <div class="gov404-eye gov404-eye-right"></div>

                            <div class="gov404-mouth"></div>

                        </div>

                        <span>4</span>

                    </div>

                    <div class="gov404-ring"></div>

                </div>

                <!-- Heading -->

                <h1>

                    Opps! Page Not Found

                </h1>

                <!-- Description -->

                <p>

                    The page you are looking for may have been removed,
                    renamed or is temporarily unavailable.
                    Please return to the previous page or
                    go back to the home page.

                </p>

                <!-- Buttons -->

                <div class="gov404-buttons">

                    <button
                        id="gov404BackBtn"
                        class="gov404-btn gov404-btn-outline">

                        <i class="fa-solid fa-arrow-left"></i>

                        Back to Previous Page

                    </button>

                    <a
                        href="index.html"
                        class="gov404-btn gov404-btn-primary">

                        <i class="fa-solid fa-house"></i>

                        Back to Home

                    </a>

                </div>

            </div>

        </div>

    </section>

    <style>
        /*==================================================
            PART 2A
        404 PAGE MAIN CSS
        Non-Conflicting
==================================================*/

*{

margin:0;
padding:0;
box-sizing:border-box;

}

html{

scroll-behavior:smooth;

}

body{

font-family:'Poppins',sans-serif;
background:#f5f8ff;
overflow-x:hidden;

}

/*==================================================
            MAIN SECTION
==================================================*/

.gov404-page{

width:100%;
min-height:100vh;

display:flex;
justify-content:center;
align-items:center;

position:relative;

overflow:hidden;

padding:60px 20px;

background:linear-gradient(
    135deg,
    #eef5ff,
    #ffffff,
    #f5fbff
);

}

/*==================================================
            FLOATING CIRCLES
==================================================*/

.gov404-circle{

position:absolute;

border-radius:50%;

animation:gov404Float 9s ease-in-out infinite;

z-index:0;

}

.gov404-circle-one{

width:260px;
height:260px;

background:rgba(59,130,246,.08);

top:-80px;
left:-80px;

}

.gov404-circle-two{

width:180px;
height:180px;

background:rgba(16,185,129,.08);

right:8%;
top:10%;

animation-delay:2s;

}

.gov404-circle-three{

width:300px;
height:300px;

background:rgba(99,102,241,.06);

bottom:-120px;
right:-100px;

animation-delay:4s;

}

.gov404-circle-four{

width:140px;
height:140px;

background:rgba(14,165,233,.08);

left:10%;
bottom:8%;

animation-delay:6s;

}

/*==================================================
            CONTAINER
==================================================*/

.gov404-container{

width:100%;
max-width:900px;

position:relative;

z-index:5;

}

/*==================================================
            CARD
==================================================*/

.gov404-card{

background:rgba(255,255,255,.85);

backdrop-filter:blur(18px);

-webkit-backdrop-filter:blur(18px);

border:1px solid rgba(255,255,255,.7);

border-radius:34px;

padding:60px 50px;

text-align:center;

box-shadow:

0 30px 70px rgba(15,23,42,.10);

}

/*==================================================
            BADGE
==================================================*/

.gov404-badge{

display:inline-flex;

align-items:center;

gap:10px;

padding:10px 22px;

border-radius:50px;

background:#eff6ff;

color:#2563eb;

font-size:15px;

font-weight:600;

margin-bottom:40px;

}

.gov404-badge i{

color:#2563eb;

}

/*==================================================
            404 ILLUSTRATION
==================================================*/

.gov404-illustration{

position:relative;

margin:auto;

width:100%;

display:flex;

justify-content:center;

align-items:center;

margin-bottom:45px;

}

/*==================================================
            RING
==================================================*/

.gov404-ring{

position:absolute;

width:250px;

height:250px;

border-radius:50%;

background:rgba(37,99,235,.06);

z-index:-1;

animation:gov404Pulse 3s infinite;

}

/*==================================================
            NUMBER
==================================================*/

.gov404-number{

display:flex;

align-items:center;

justify-content:center;

gap:15px;

}

.gov404-number span{

font-size:150px;

font-weight:800;

color:#2563eb;

line-height:1;

}

/*==================================================
            FACE
==================================================*/

.gov404-face{

width:95px;

height:95px;

background:#3b82f6;

border-radius:50%;

position:relative;

animation:gov404Shake 3s infinite;

}

/*==================================================
            EYES
==================================================*/

.gov404-eye{

position:absolute;

width:14px;

height:14px;

background:#ffffff;

border-radius:50%;

top:30px;

}

.gov404-eye::after{

content:"";

position:absolute;

width:5px;

height:5px;

background:#111827;

border-radius:50%;

left:5px;

top:5px;

}

.gov404-eye-left{

left:24px;

}

.gov404-eye-right{

right:24px;

}

/*==================================================
            MOUTH
==================================================*/

.gov404-mouth{

position:absolute;

width:22px;

height:26px;

background:#fee2e2;

border-radius:0 0 20px 20px;

border:4px solid #1e293b;

border-top:none;

left:50%;

transform:translateX(-50%);

bottom:20px;

}

/*==================================================
            HEADING
==================================================*/

.gov404-card h1{

font-size:42px;

color:#111827;

margin-bottom:18px;

font-weight:700;

}

/*==================================================
            DESCRIPTION
==================================================*/

.gov404-card p{

max-width:650px;

margin:auto;

font-size:17px;

color:#64748b;

line-height:1.9;

margin-bottom:45px;

}

/*==================================================
            BUTTON AREA
==================================================*/

.gov404-buttons{

display:flex;

justify-content:center;

align-items:center;

gap:18px;

flex-wrap:wrap;

}

/*==================================================
            BUTTON
==================================================*/

.gov404-btn{

min-width:220px;

height:58px;

border-radius:50px;

display:flex;

justify-content:center;

align-items:center;

gap:10px;

text-decoration:none;

cursor:pointer;

font-size:15px;

font-weight:600;

transition:.35s;

}

.gov404-btn i{

transition:.35s;

}

/* Primary */

.gov404-btn-primary{

background:#2563eb;

color:#ffffff;

border:none;

box-shadow:0 15px 35px rgba(37,99,235,.28);

}

.gov404-btn-primary:hover{

transform:translateY(-6px);

background:#1d4ed8;

}

.gov404-btn-primary:hover i{

transform:translateX(4px);

}

/* Outline */

.gov404-btn-outline{

background:#ffffff;

color:#2563eb;

border:2px solid #2563eb;

}

.gov404-btn-outline:hover{

background:#2563eb;

color:#ffffff;

transform:translateY(-6px);

}

.gov404-btn-outline:hover i{

transform:translateX(-4px);

}


/*==================================================
            PART 2B
      RESPONSIVE + ANIMATIONS
==================================================*/

/*=========================================
        Reveal Animation
=========================================*/

.reveal-bottom{

opacity:0;

transform:translateY(80px);

transition:
    opacity .8s ease,
    transform .8s ease;

}

.reveal-bottom.active{

opacity:1;

transform:translateY(0);

}

/*=========================================
    Floating Animation
=========================================*/

@keyframes gov404Float{

0%,100%{

    transform:translateY(0);

}

50%{

    transform:translateY(-20px);

}

}

/*=========================================
    Pulse Ring
=========================================*/

@keyframes gov404Pulse{

0%{

    transform:scale(.9);

    opacity:.4;

}

50%{

    transform:scale(1.08);

    opacity:.15;

}

100%{

    transform:scale(.9);

    opacity:.4;

}

}

/*=========================================
    Face Shake
=========================================*/

@keyframes gov404Shake{

0%,100%{

    transform:rotate(0deg);

}

20%{

    transform:rotate(-5deg);

}

40%{

    transform:rotate(5deg);

}

60%{

    transform:rotate(-4deg);

}

80%{

    transform:rotate(4deg);

}

}

/*=========================================
    Button Animation
=========================================*/

.gov404-btn{

position:relative;

overflow:hidden;

}

.gov404-btn::before{

content:"";

position:absolute;

left:-100%;

top:0;

width:100%;

height:100%;

background:rgba(255,255,255,.18);

transition:.5s;

}

.gov404-btn:hover::before{

left:100%;

}

/*=========================================
    Large Laptop
=========================================*/

@media(max-width:1400px){

.gov404-container{

max-width:820px;

}

.gov404-card{

padding:55px 45px;

}

}

/*=========================================
    Laptop
=========================================*/

@media(max-width:1200px){

.gov404-number span{

font-size:130px;

}

.gov404-face{

width:88px;

height:88px;

}

.gov404-card{

padding:50px 40px;

}

}

/*=========================================
    Tablet
=========================================*/

@media(max-width:992px){

.gov404-page{

padding:50px 20px;

}

.gov404-card{

padding:45px 30px;

}

.gov404-number span{

font-size:105px;

}

.gov404-face{

width:78px;

height:78px;

}

.gov404-ring{

width:210px;

height:210px;

}

.gov404-card h1{

font-size:34px;

}

.gov404-card p{

font-size:16px;

}

}

/*=========================================
    Mobile
=========================================*/

@media(max-width:768px){

.gov404-page{

padding:40px 15px;

}

.gov404-card{

padding:35px 22px;

border-radius:24px;

}

.gov404-badge{

font-size:14px;

padding:8px 18px;

}

.gov404-number{

gap:10px;

}

.gov404-number span{

font-size:78px;

}

.gov404-face{

width:60px;

height:60px;

}

.gov404-eye{

width:10px;

height:10px;

top:18px;

}

.gov404-eye::after{

width:4px;

height:4px;

left:3px;

top:3px;

}

.gov404-eye-left{

left:15px;

}

.gov404-eye-right{

right:15px;

}

.gov404-mouth{

width:18px;

height:20px;

bottom:12px;

}

.gov404-ring{

width:150px;

height:150px;

}

.gov404-card h1{

font-size:28px;

}

.gov404-card p{

font-size:15px;

margin-bottom:35px;

}

.gov404-buttons{

flex-direction:column;

width:100%;

}

.gov404-btn{

width:100%;

min-width:100%;

}

}

/*=========================================
    Small Mobile
=========================================*/

@media(max-width:480px){

.gov404-page{

padding:25px 12px;

}

.gov404-card{

padding:28px 18px;

}

.gov404-number span{

font-size:65px;

}

.gov404-face{

width:50px;

height:50px;

}

.gov404-ring{

width:120px;

height:120px;

}

.gov404-card h1{

font-size:24px;

}

.gov404-card p{

font-size:14px;

line-height:1.8;

}

.gov404-btn{

height:52px;

font-size:14px;

}

}

/*=========================================
    Ultra Wide
=========================================*/

@media(min-width:1600px){

.gov404-container{

max-width:1050px;

}

.gov404-card{

padding:80px 70px;

}

.gov404-number span{

font-size:180px;

}

.gov404-face{

width:115px;

height:115px;

}

}

/*=========================================
    Performance
=========================================*/

.gov404-card,
.gov404-btn,
.gov404-face,
.gov404-circle{

will-change:transform;

}
    </style>

    <script>
        /*==================================================
            GOV404 PAGE JAVASCRIPT
            Part 3
            Non-Conflicting
==================================================*/

document.addEventListener("DOMContentLoaded", function () {

/*=========================================
        REVEAL ANIMATION
=========================================*/

const gov404RevealItems =
    document.querySelectorAll(".reveal-bottom");

const gov404Observer =
    new IntersectionObserver(function (entries) {

        entries.forEach(function (entry) {

            if (entry.isIntersecting) {

                entry.target.classList.add("active");

            }

        });

    }, {

        threshold:0.20

    });

gov404RevealItems.forEach(function(item){

    gov404Observer.observe(item);

});

/*=========================================
        BACK BUTTON
=========================================*/

const gov404BackBtn =
    document.getElementById("gov404BackBtn");

if(gov404BackBtn){

    gov404BackBtn.addEventListener("click",function(){

        if(document.referrer !== ""){

            history.back();

        }

        else{

            window.location.href="index.html";

        }

    });

}

/*=========================================
        HOME BUTTON
=========================================*/

const gov404HomeBtn =
    document.querySelector(".gov404-btn-primary");

if(gov404HomeBtn){

    gov404HomeBtn.addEventListener("click",function(){

        window.location.href="index.html";

    });

}

/*=========================================
        FLOATING CIRCLES
=========================================*/

const gov404Circles =
    document.querySelectorAll(".gov404-circle");

gov404Circles.forEach(function(circle,index){

    circle.style.animationDelay =
        (index * 1.5) + "s";

});

/*=========================================
        FACE BLINK
=========================================*/

const gov404Eyes =
    document.querySelectorAll(".gov404-eye");

function gov404Blink(){

    gov404Eyes.forEach(function(eye){

        eye.style.transform="scaleY(0.15)";

    });

    setTimeout(function(){

        gov404Eyes.forEach(function(eye){

            eye.style.transform="scaleY(1)";

        });

    },180);

}

setInterval(gov404Blink,3000);

/*=========================================
        PARALLAX EFFECT
=========================================*/

document.addEventListener("mousemove",function(e){

    const x =
        (e.clientX/window.innerWidth)-0.5;

    const y =
        (e.clientY/window.innerHeight)-0.5;

    gov404Circles.forEach(function(circle,index){

        const move =
            (index+1)*10;

        circle.style.transform =
            "translate(" +
            (x*move) +
            "px," +
            (y*move) +
            "px)";

    });

});

/*=========================================
        CARD HOVER
=========================================*/

const gov404Card =
    document.querySelector(".gov404-card");

if(gov404Card){

    gov404Card.addEventListener("mouseenter",function(){

        gov404Card.style.transform="translateY(-8px)";

    });

    gov404Card.addEventListener("mouseleave",function(){

        gov404Card.style.transform="translateY(0px)";

    });

}

/*=========================================
        BUTTON RIPPLE EFFECT
=========================================*/

const gov404Buttons =
    document.querySelectorAll(".gov404-btn");

gov404Buttons.forEach(function(button){

    button.addEventListener("click",function(e){

        const ripple =
            document.createElement("span");

        const size =
            Math.max(
                button.clientWidth,
                button.clientHeight
            );

        const rect =
            button.getBoundingClientRect();

        ripple.style.width=size+"px";
        ripple.style.height=size+"px";

        ripple.style.left=
            e.clientX-
            rect.left-
            size/2+"px";

        ripple.style.top=
            e.clientY-
            rect.top-
            size/2+"px";

        ripple.className="gov404-ripple";

        const oldRipple=
            button.querySelector(".gov404-ripple");

        if(oldRipple){

            oldRipple.remove();

        }

        button.appendChild(ripple);

    });

});

/*=========================================
        ESC KEY → HOME
=========================================*/

document.addEventListener("keydown",function(e){

    if(e.key==="Escape"){

        window.location.href="index.html";

    }

});

});
    </script>
</body>

</html>
