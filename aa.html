    <!-- LEFT SIDE -->

        <!-- Mobile Menu Button -->
        <button
            type="button"
            class="gov-officer-menu-btn"
            id="govOfficerMenuBtn"
            aria-label="Open sidebar"
        >
            <i class="fa-solid fa-bars"></i>
        </button>


        <!-- Government Logo -->
        <a
            href="index.html"
            class="gov-officer-logo"
            aria-label="Government Officer Dashboard Home"
        >
            <div class="gov-officer-logo-icon">
                <i class="fa-solid fa-building-columns"></i>
            </div>

            <div class="gov-officer-logo-text">
                <strong>GOVERNMENT</strong>
                <span>OFFICER PORTAL</span>
            </div>
        </a>

    </div>


    <!-- RIGHT SIDE -->
    <div class="gov-officer-topbar-right">

        


        <!-- User Information -->
        <div class="gov-officer-user-box">

            <div class="gov-officer-user-avatar" id="govOfficerAvatar">
                GO
            </div>

            <div class="gov-officer-user-details">

                <strong
                    id="govOfficerName"
                    class="gov-officer-user-name"
                >
                    Government Officer
                </strong>

                <span
                    id="govOfficerEmail"
                    class="gov-officer-user-email"
                >
                    officer@gov.in
                </span>

            </div>

            

        </div>

    </div>

</header>

                My applications
            </span>
        </a>


        <!-- Citizens -->

            </span>

            <span class="gov-officer-nav-text">
            Documents 
            </span>
        </a> -->


        <!-- Services -->
        <a

        >
            <span class="gov-officer-nav-icon">

            </span>

            <span class="gov-officer-nav-text">
               Appointments
            </span>
        </a>




        <!-- =================================================
             MANAGEMENT
             ================================================= -->
        <p class="gov-officer-nav-title gov-officer-management-title">
            MANAGEMENT
        </p>


        <!-- Tasks -->
        <a

            class="gov-officer-nav-link"

        <!-- Settings -->

    <!-- SIDEBAR BOTTOM -->

        <!-- Logout -->

        >

<style>

    /* =====================================================
       STACKLY LOGO - SIDEBAR
       ===================================================== */
    
    .gov-officer-stackly-brand {
        display: flex;
        align-items: center;
        width: auto;
        height: 50px;
        text-decoration: none;
    }
    
    .gov-officer-stackly-logo {
        display: block;
        width: 155px;
        max-width: 100%;
        height: auto;
        object-fit: contain;
    
        transition:
            transform 0.3s ease,
            opacity 0.3s ease;
    }
    
    .gov-officer-stackly-brand:hover .gov-officer-stackly-logo {
        transform: scale(1.03);
        opacity: 0.92;
    }
    
    
    /* =========================================================
       ROOT VARIABLES
       ========================================================= */
    
    :root {
    
        --gov-officer-primary: #0756a8;
        --gov-officer-primary-dark: #043b78;
        --gov-officer-primary-light: #eaf4ff;
    
        --gov-officer-blue: #0b63c7;
        --gov-officer-navy: #063b73;
    
        --gov-officer-white: #ffffff;
        --gov-officer-bg: #f4f8fc;
    
        --gov-officer-text: #172b4d;
        --gov-officer-text-light: #6b7c93;
    
        --gov-officer-border: #dce7f2;
    
        --gov-officer-danger: #dc3545;
    
        --gov-officer-sidebar-width: 270px;
        --gov-officer-topbar-height: 76px;
    
        --gov-officer-shadow:
            0 4px 20px rgba(10, 61, 110, 0.08);
    
        --gov-officer-transition: 0.3s ease;
    }
    
    
    /* =========================================================
       RESET
       ========================================================= */
    
    .gov-officer-topbar *,
    .gov-officer-sidebar *,
    .gov-officer-main-content *,
    .gov-officer-sidebar-overlay * {
        box-sizing: border-box;
    }
    
    .gov-officer-topbar button,
    .gov-officer-sidebar button {
        font-family: inherit;
    }
    
    .gov-officer-topbar a,
    .gov-officer-sidebar a {
        text-decoration: none;
    }
    
    
    /* =========================================================
       BODY SUPPORT
       ========================================================= */
    
    body {
        margin: 0;
        font-family: "Inter", sans-serif;
        background: var(--gov-officer-bg);
        color: var(--gov-officer-text);
    }
    
    
    /* =========================================================
       TOP BAR
       ========================================================= */
    
    .gov-officer-topbar {
        position: fixed;
        top: 0;
        left: var(--gov-officer-sidebar-width);
        right: 0;
    
        height: var(--gov-officer-topbar-height);
    
        display: flex;
        align-items: center;
        justify-content: space-between;
    
        padding: 0 28px;
    
        background: var(--gov-officer-white);
    
        border-bottom: 1px solid var(--gov-officer-border);
    
        box-shadow: var(--gov-officer-shadow);
    
        z-index: 1000;
    
        transition:
            left var(--gov-officer-transition);
    }
    
    
    /* =========================================================
       TOP BAR LEFT
       ========================================================= */
    
    .gov-officer-topbar-left {
        display: flex;
        align-items: center;
        gap: 18px;
    }
    
    
    /* =========================================================
       MOBILE MENU BUTTON
       ========================================================= */
    
    .gov-officer-menu-btn {
        display: none;
    
        width: 44px;
        height: 44px;
    
        border: 1px solid var(--gov-officer-border);
        border-radius: 10px;
    
        background: var(--gov-officer-primary-light);
        color: var(--gov-officer-primary);
    
        font-size: 23px;
    
        cursor: pointer;
    
        transition: var(--gov-officer-transition);
    }
    
    .gov-officer-menu-btn:hover {
        background: var(--gov-officer-primary);
        color: var(--gov-officer-white);
    }
    
    
    /* =========================================================
       LOGO
       ========================================================= */
    
    .gov-officer-logo {
        display: flex;
        align-items: center;
        gap: 12px;
    
        color: var(--gov-officer-navy);
    }
    
    .gov-officer-logo-icon {
        width: 46px;
        height: 46px;
    
        display: flex;
        align-items: center;
        justify-content: center;
    
        border-radius: 10px;
    
        background:
            linear-gradient(
                135deg,
                var(--gov-officer-primary),
                var(--gov-officer-navy)
            );
    
        color: var(--gov-officer-white);
    
        font-size: 22px;
    
        box-shadow:
            0 5px 15px rgba(7, 86, 168, 0.20);
    }
    
    .gov-officer-logo-text {
        display: flex;
        flex-direction: column;
        line-height: 1.2;
    }
    
    .gov-officer-logo-text strong {
        font-size: 26px;
        font-weight: 800;
        letter-spacing: 0.5px;
    }
    
    .gov-officer-logo-text span {
        margin-top: 4px;
    
        font-size: 13px;
        font-weight: 600;
    
        color: var(--gov-officer-text-light);
    
        letter-spacing: 1px;
    }
    
    
    /* =========================================================
       TOP BAR RIGHT
       ========================================================= */
    
    .gov-officer-topbar-right {
        display: flex;
        align-items: center;
        gap: 22px;
    }
    
    
    /* =========================================================
       NOTIFICATION
       ========================================================= */
    
    .gov-officer-notification-btn {
        position: relative;
    
        width: 44px;
        height: 44px;
    
        display: flex;
        align-items: center;
        justify-content: center;
    
        border: 1px solid var(--gov-officer-border);
        border-radius: 50%;
    
        background: var(--gov-officer-white);
    
        color: var(--gov-officer-primary);
    
        font-size: 20px;
    
        cursor: pointer;
    
        transition: var(--gov-officer-transition);
    }
    
    .gov-officer-notification-btn:hover {
        background: var(--gov-officer-primary-light);
        transform: translateY(-2px);
    }
    
    .gov-officer-notification-dot {
        position: absolute;
    
        top: 6px;
        right: 7px;
    
        width: 8px;
        height: 8px;
    
        border-radius: 50%;
    
        background: #e63946;
    
        border: 2px solid var(--gov-officer-white);
    }
    
    
    /* =========================================================
       USER BOX
       ========================================================= */
    
    .gov-officer-user-box {
        display: flex;
        align-items: center;
        gap: 12px;
    
        cursor: pointer;
    }
    
    .gov-officer-user-avatar {
        width: 44px;
        height: 44px;
    
        flex-shrink: 0;
    
        display: flex;
        align-items: center;
        justify-content: center;
    
        border-radius: 50%;
    
        background:
            linear-gradient(
                135deg,
                #0b63c7,
                #063b73
            );
    
        color: var(--gov-officer-white);
    
        font-size: 19px;
        font-weight: 800;
    
        box-shadow:
            0 4px 12px rgba(7, 86, 168, 0.20);
    }
    
    .gov-officer-user-details {
        display: flex;
        flex-direction: column;
    
        min-width: 0;
    }
    
    .gov-officer-user-name {
        max-width: 200px;
    
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
    
        font-size: 15px;
        font-weight: 700;
    
        color: var(--gov-officer-text);
    }
    
    .gov-officer-user-email {
        max-width: 220px;
    
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
    
        margin-top: 4px;
    
        font-size: 13px;
    
        color: var(--gov-officer-text-light);
    }
    
    .gov-officer-user-arrow {
        margin-left: 3px;
    
        font-size: 12px;
    
        color: var(--gov-officer-text-light);
    }
    
    
    /* =========================================================
       SIDEBAR
       ========================================================= */
    
    .gov-officer-sidebar {
        position: fixed;
    
        top: 0;
        left: 0;
        bottom: 0;
    
        width: var(--gov-officer-sidebar-width);
    
        display: flex;
        flex-direction: column;
    
        background: var(--gov-officer-white);
    
        border-right: 1px solid var(--gov-officer-border);
    
        box-shadow:
            5px 0 25px rgba(6, 59, 115, 0.07);
    
        z-index: 1200;
    
        overflow-y: auto;
    
        scrollbar-width: thin;
    
        scrollbar-color:
            var(--gov-officer-primary)
            transparent;
    }
    
    
    /* =========================================================
       SIDEBAR HEADER
       ========================================================= */
    
    .gov-officer-sidebar-header {
        min-height: 76px;
    
        display: flex;
        align-items: center;
        justify-content: space-between;
    
        padding: 0 19px;
    
        border-bottom: 1px solid var(--gov-officer-border);
    
        background:
            linear-gradient(
                180deg,
                #ffffff,
                #f9fcff
            );
    }
    
    .gov-officer-sidebar-brand {
        display: flex;
        align-items: center;
        gap: 11px;
    }
    
    .gov-officer-sidebar-brand-icon {
        width: 41px;
        height: 41px;
    
        display: flex;
        align-items: center;
        justify-content: center;
    
        border-radius: 9px;
    
        background: var(--gov-officer-primary-light);
    
        color: var(--gov-officer-primary);
    
        font-size: 18px;
    }
    
    .gov-officer-sidebar-brand div:last-child {
        display: flex;
        flex-direction: column;
    }
    
    .gov-officer-sidebar-brand strong {
        font-size: 15px;
        font-weight: 800;
    
        color: var(--gov-officer-navy);
    }
    
    .gov-officer-sidebar-brand span {
        margin-top: 3px;
    
        font-size: 11px;
    
        color: var(--gov-officer-text-light);
    }
    
    
    /* =========================================================
       CLOSE BUTTON
       ========================================================= */
    
    .gov-officer-close-btn {
        display: none;
    
        width: 37px;
        height: 37px;
    
        align-items: center;
        justify-content: center;
    
        border: none;
        border-radius: 8px;
    
        background: #eef5fc;
    
        color: var(--gov-officer-primary);
    
        font-size: 20px;
    
        cursor: pointer;
    
        transition: var(--gov-officer-transition);
    }
    
    .gov-officer-close-btn:hover {
        background: var(--gov-officer-primary);
        color: var(--gov-officer-white);
        transform: rotate(90deg);
    }
    
    
    /* =========================================================
       SIDEBAR PROFILE
       ========================================================= */
    
    .gov-officer-sidebar-profile {
        margin: 17px 15px 12px;
    
        padding: 14px;
    
        display: flex;
        align-items: center;
    
        gap: 11px;
    
        border-radius: 12px;
    
        background:
            linear-gradient(
                135deg,
                #edf6ff,
                #f8fbff
            );
    
        border: 1px solid #dcecfb;
    }
    
    .gov-officer-sidebar-avatar {
        width: 41px;
        height: 41px;
    
        flex-shrink: 0;
    
        display: flex;
        align-items: center;
        justify-content: center;
    
        border-radius: 50%;
    
        background: var(--gov-officer-primary);
    
        color: var(--gov-officer-white);
    
        font-size: 14px;
        font-weight: 800;
    }
    
    .gov-officer-sidebar-profile-info {
        display: flex;
        flex-direction: column;
    
        min-width: 0;
    }
    
    .gov-officer-sidebar-profile-info strong {
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
    
        font-size: 14px;
        font-weight: 700;
    
        color: var(--gov-officer-text);
    }
    
    .gov-officer-sidebar-profile-info span {
        display: flex;
        align-items: center;
    
        gap: 5px;
    
        margin-top: 4px;
    
        font-size: 12px;
    
        color: var(--gov-officer-text-light);
    }
    
    .gov-officer-sidebar-profile-info span i {
        font-size: 7px;
        color: #20a464;
    }
    
    
    /* =========================================================
       NAVIGATION
       ========================================================= */
    
    .gov-officer-navigation {
        padding: 3px 12px 12px;
    }
    
    .gov-officer-nav-title {
        margin: 14px 8px 9px;
    
        font-size: 11px;
        font-weight: 800;
    
        color: #91a2b7;
    
        letter-spacing: 1px;
    }
    
    .gov-officer-management-title {
        margin-top: 21px;
    }
    
    
    /* =========================================================
       NAV LINK
       ========================================================= */
    
    .gov-officer-nav-link {
        position: relative;
    
        min-height: 48px;
    
        margin: 3px 0;
    
        padding: 0 11px;
    
        display: flex;
        align-items: center;
    
        gap: 12px;
    
        border-radius: 9px;
    
        color: #536b86;
    
        font-size: 14px;
        font-weight: 600;
    
        transition:
            background var(--gov-officer-transition),
            color var(--gov-officer-transition),
            transform var(--gov-officer-transition);
    }
    
    .gov-officer-nav-link:hover {
        background: var(--gov-officer-primary-light);
        color: var(--gov-officer-primary);
    
        transform: translateX(3px);
    }
    
    .gov-officer-nav-active {
        background:
            linear-gradient(
                90deg,
                #e7f2ff,
                #f2f8ff
            );
    
        color: var(--gov-officer-primary);
    
        font-weight: 700;
    }
    
    .gov-officer-nav-active::before {
        content: "";
    
        position: absolute;
    
        left: 0;
        top: 8px;
        bottom: 8px;
    
        width: 3px;
    
        border-radius: 0 4px 4px 0;
    
        background: var(--gov-officer-primary);
    }
    
    
    /* =========================================================
       NAV ICON
       ========================================================= */
    
    .gov-officer-nav-icon {
        width: 28px;
        height: 28px;
    
        display: flex;
        align-items: center;
        justify-content: center;
    
        flex-shrink: 0;
    
        border-radius: 7px;
    
        background: transparent;
    
        color: inherit;
    
        font-size: 16px;
    }
    
    .gov-officer-nav-active .gov-officer-nav-icon {
        background: #d7eaff;
    }
    
    
    /* =========================================================
       NAV TEXT
       ========================================================= */
    
    .gov-officer-nav-text {
        flex: 1;
    }
    
    
    /* =========================================================
       NAV BADGE
       ========================================================= */
    
    .gov-officer-nav-badge {
        min-width: 22px;
        height: 22px;
    
        padding: 0 6px;
    
        display: inline-flex;
        align-items: center;
        justify-content: center;
    
        border-radius: 20px;
    
        background: var(--gov-officer-primary);
    
        color: white;
    
        font-size: 10px;
        font-weight: 700;
    }
    
    .gov-officer-badge-red {
        background: #e74c5a;
    }
    
    
    /* =========================================================
       SIDEBAR BOTTOM
       ========================================================= */
    
    .gov-officer-sidebar-bottom {
        margin-top: auto;
    
        padding: 10px 12px 18px;
    
        border-top: 1px solid var(--gov-officer-border);
    }
    
    
    /* =========================================================
       HELP LINK
       ========================================================= */
    
    .gov-officer-help-link {
        margin-bottom: 5px;
    }
    
    
    /* =========================================================
       LOGOUT
       ========================================================= */
    
    .gov-officer-logout-btn {
        width: 100%;
        min-height: 48px;
    
        display: flex;
        align-items: center;
    
        gap: 12px;
    
        padding: 0 11px;
    
        border: none;
        border-radius: 9px;
    
        background: #fff3f4;
    
        color: var(--gov-officer-danger);
    
        font-family: inherit;
    
        font-size: 14px;
        font-weight: 700;
    
        cursor: pointer;
    
        transition: var(--gov-officer-transition);
    }
    
    .gov-officer-logout-btn:hover {
        background: var(--gov-officer-danger);
        color: white;
    
        transform: translateY(-2px);
    }
    
    .gov-officer-logout-btn .gov-officer-nav-icon {
        color: inherit;
    }
    
    
    /* =========================================================
       SIDEBAR OVERLAY
       ========================================================= */
    
    .gov-officer-sidebar-overlay {
        position: fixed;
    
        inset: 0;
    
        background: rgba(3, 30, 60, 0.55);
    
        backdrop-filter: blur(2px);
    
        opacity: 0;
        visibility: hidden;
    
        z-index: 1100;
    
        transition:
            opacity var(--gov-officer-transition),
            visibility var(--gov-officer-transition);

<script>
    
/* =========================================================
   GOVERNMENT OFFICER DASHBOARD
   TOP BAR + SIDEBAR JAVASCRIPT
   ========================================================= */

document.addEventListener("DOMContentLoaded", function () {

    /* =====================================================
       ELEMENTS
       ===================================================== */

    const menuBtn = document.getElementById("govOfficerMenuBtn");
    const closeBtn = document.getElementById("govOfficerCloseBtn");

    const sidebar = document.getElementById("govOfficerSidebar");
    const overlay = document.getElementById("govOfficerSidebarOverlay");

    const logoutBtn = document.getElementById("govOfficerLogoutBtn");


    /* =====================================================
       LOCAL STORAGE
       ===================================================== */

    const storedName =
        localStorage.getItem("userName") ||
        localStorage.getItem("name") ||
        "Government Officer";

    const storedEmail =
        localStorage.getItem("userEmail") ||
        localStorage.getItem("email") ||
        "officer@gov.in";

    const storedRole =
        localStorage.getItem("userRole") ||
        localStorage.getItem("role") ||
        "Government Officer";


    /* =====================================================
       GET USER ELEMENTS
       ===================================================== */

    const topName =
        document.getElementById("govOfficerName");

    const topEmail =
        document.getElementById("govOfficerEmail");

    const topAvatar =
        document.getElementById("govOfficerAvatar");

    const sideName =
        document.getElementById("govOfficerSideName");

    const sideAvatar =
        document.getElementById("govOfficerSideAvatar");


    /* =====================================================
       DISPLAY USER NAME
       ===================================================== */

    if (topName) {
        topName.textContent = storedName;
    }

    if (topEmail) {
        topEmail.textContent = storedEmail;
    }

    if (sideName) {
        sideName.textContent = storedName;
    }


    /* =====================================================
       GENERATE USER INITIALS
       ===================================================== */

    function getInitials(name) {

        if (!name || name.trim() === "") {
            return "GO";
        }

        const words = name
            .trim()
            .split(/\s+/)
            .filter(Boolean);

        if (words.length === 1) {
            return words[0]
                .substring(0, 2)
                .toUpperCase();
        }

        return (
            words[0].charAt(0) +
            words[words.length - 1].charAt(0)
        ).toUpperCase();
    }


    const initials = getInitials(storedName);


    if (topAvatar) {
        topAvatar.textContent = initials;
    }

    if (sideAvatar) {
        sideAvatar.textContent = initials;
    }


    /* =====================================================
       UPDATE ROLE
       ===================================================== */

    const roleElements =
        document.querySelectorAll(
            ".gov-officer-sidebar-profile-info span"
        );

    roleElements.forEach(function (element) {

        const roleText =
            storedRole && storedRole.trim() !== ""
                ? storedRole
                : "Government Officer";

        element.innerHTML =
            '<i class="fa-solid fa-circle"></i> ' +
            roleText;

    });


    /* =====================================================
       OPEN SIDEBAR
       ===================================================== */

    function openSidebar() {

        if (!sidebar) return;

        sidebar.classList.add(
            "gov-officer-sidebar-open"
        );

        if (overlay) {
            overlay.classList.add(
                "gov-officer-overlay-active"
            );
        }

        document.body.style.overflow = "hidden";

    }


    /* =====================================================
       CLOSE SIDEBAR
       ===================================================== */

    function closeSidebar() {

        if (!sidebar) return;

        sidebar.classList.remove(
            "gov-officer-sidebar-open"
        );

        if (overlay) {
            overlay.classList.remove(
                "gov-officer-overlay-active"
            );
        }

        document.body.style.overflow = "";

    }


    /* =====================================================
       MENU BUTTON
       ===================================================== */

    if (menuBtn) {

        menuBtn.addEventListener(
            "click",
            function () {
                openSidebar();
            }
        );

    }


    /* =====================================================
       CLOSE BUTTON
       ===================================================== */

    if (closeBtn) {

        closeBtn.addEventListener(
            "click",
            function () {
                closeSidebar();
            }
        );

    }


    /* =====================================================
       OVERLAY CLICK
       ===================================================== */

    if (overlay) {

        overlay.addEventListener(
            "click",
            function () {
                closeSidebar();
            }
        );

    }


    /* =====================================================
       CLOSE SIDEBAR WHEN NAVIGATION ITEM IS CLICKED
       MOBILE ONLY
       ===================================================== */

    const navigationLinks =
        document.querySelectorAll(
            ".gov-officer-nav-link"
        );

    navigationLinks.forEach(function (link) {

        link.addEventListener(
            "click",
            function () {

                if (window.innerWidth <= 991) {
                    closeSidebar();
                }

            }
        );

    });


    /* =====================================================
       ESCAPE KEY CLOSE
       ===================================================== */

    document.addEventListener(
        "keydown",
        function (event) {

            if (event.key === "Escape") {
                closeSidebar();
            }

        }
    );


    /* =====================================================
       CLOSE SIDEBAR WHEN RESIZING TO DESKTOP
       ===================================================== */

    window.addEventListener(
        "resize",
        function () {

            if (window.innerWidth >= 992) {
                closeSidebar();
            }

        }
    );


    /* =====================================================
       LOGOUT
       ===================================================== */

    if (logoutBtn) {

        logoutBtn.addEventListener(
            "click",
            function () {

                const logoutConfirmed =
                    confirm(
                        "Are you sure you want to logout?"
                    );

                if (!logoutConfirmed) {
                    return;
                }


                /* -----------------------------------------
                   REMOVE LOGIN SESSION
                   ----------------------------------------- */

                localStorage.removeItem(
                    "isLoggedIn"
                );

                localStorage.removeItem(
                    "userName"
                );

                localStorage.removeItem(
                    "userEmail"
                );

                localStorage.removeItem(
                    "userRole"
                );


                /* -----------------------------------------
                   OPTIONAL ALTERNATIVE STORAGE KEYS
                   ----------------------------------------- */

                localStorage.removeItem(
                    "name"
                );

                localStorage.removeItem(
                    "email"
                );

                localStorage.removeItem(
                    "role"
                );


                /* -----------------------------------------
                   REDIRECT TO LOGIN
                   ----------------------------------------- */

                window.location.href =
                    "login.html";

            }
        );

    }


    /* =====================================================
       ACTIVE SIDEBAR ITEM
       ===================================================== */

    const currentPage =
        window.location.pathname
            .split("/")
            .pop()
            .toLowerCase();


    navigationLinks.forEach(function (link) {

        const linkPage =
            link.getAttribute("href");

        if (!linkPage) return;

        const cleanLinkPage =
            linkPage
                .split("/")
                .pop()
                .toLowerCase();

        if (
            cleanLinkPage === currentPage &&
            currentPage !== ""
        ) {

            navigationLinks.forEach(function (item) {
                item.classList.remove(
                    "gov-officer-nav-active"
                );
            });

            link.classList.add(
                "gov-officer-nav-active"
            );

        }

    });


    /* =====================================================
       PREVENT SIDEBAR SCROLL FROM AFFECTING PAGE
       ===================================================== */

    if (sidebar) {

        sidebar.addEventListener(
            "wheel",
            function (event) {

                const canScroll =
                    sidebar.scrollHeight >
                    sidebar.clientHeight;

                if (canScroll) {
                    event.stopPropagation();
                }

            }
        );

    }


    /* =====================================================
       NOTIFICATION BUTTON
       ===================================================== */

    const notificationBtn =
        document.querySelector(
            ".gov-officer-notification-btn"
        );

    if (notificationBtn) {

        notificationBtn.addEventListener(
            "click",
            function () {

                window.location.href =
                    "notifications.html";

            }
        );

    }


    /* =====================================================
       INITIAL STATE
       ===================================================== */

    closeSidebar();

});


</script>
